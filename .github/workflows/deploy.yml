name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Rebuild on a schedule so the weather fallback cache stays fresh.
  # The cache is generated at build time and deployed, never committed.
  schedule:
    - cron: '0 4,10,16,22 * * *'  # 07:00, 13:00, 19:00, 01:00 Athens time (summer)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fallback only: the site fetches live weather first. If Open-Meteo is down,
      # deploy anyway without a cache rather than failing the whole build.
      - name: Fetch weather cache
        run: node scripts/update-weather-cache.mjs
        continue-on-error: true

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

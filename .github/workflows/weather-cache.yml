name: Update Weather Cache

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # 07:00, 13:00, 19:00, 01:00 Athens time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch weather data
        run: node scripts/update-weather-cache.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/weather-cache.json
          git diff --staged --quiet || git commit -m "chore: update weather cache"
          git push

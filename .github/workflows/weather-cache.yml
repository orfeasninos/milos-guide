name: Update Weather Cache

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # 07:00, 13:00, 19:00, 01:00 Athens time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather data
        run: |
          WEATHER=$(curl -sf "https://api.open-meteo.com/v1/forecast?latitude=36.7257&longitude=24.4496&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,uv_index,relative_humidity_2m&hourly=temperature_2m,weather_code,wind_speed_10m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FAthens&forecast_days=7&models=best_match")
          if [ $? -ne 0 ]; then echo "Weather fetch failed"; exit 1; fi

          if echo "$WEATHER" | jq -e '.error' > /dev/null 2>&1; then
            echo "API error: $(echo $WEATHER | jq -r '.reason')"
            exit 1
          fi

          MARINE=$(curl -sf "https://marine-api.open-meteo.com/v1/marine?latitude=36.7257&longitude=24.4496&current=wave_height,sea_surface_temperature&timezone=Europe%2FAthens&forecast_days=1" || echo '{"current":null}')

          CACHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n --argjson w "$WEATHER" --argjson m "$MARINE" --arg t "$CACHED_AT" \
            '{weather: $w, marine: $m, cachedAt: $t}' > public/weather-cache.json

          echo "Cache updated at $CACHED_AT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/weather-cache.json
          git diff --staged --quiet || git commit -m "chore: update weather cache"
          git push
